[project]
name = "conveer"
version = "0.1.0"
description = "Startup-Conveer — autonomous AI company (agent conveyor). Phase 0: idea generation + initial hypothesis testing department."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.1",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conveer = "conveer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conveer = ["roles/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
